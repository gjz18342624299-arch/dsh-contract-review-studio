<script id="onboarding-demo-model">/* Synthetic onboarding data and local-only review actions. */
(function (root) {
  'use strict';
  const projectId = 'onboarding-demo-project-v1';
  const contractId = 'onboarding-demo-contract-v1';
  const copy = value => JSON.parse(JSON.stringify(value));
  function create(sampleFactory) {
    const contract = sampleFactory(contractId, '演示合同 · 网站设计服务（虚构）');
    Object.assign(contract, {
      onboardingDemo: true, projectId, kind: 'service', sample: true,
      partyA: '示例甲方有限公司（虚构）', partyB: '示例乙方有限公司（虚构）',
      templateId: null, ruleIds: [], annotations: [], checks: [],
      decisions: {}, overrides: {}, needsReview: false, updated: '演示材料',
      snapshot: { name: '预设演示检查清单', version: 1, reviewMode: 'demo', rules: [] }
    });
    contract.risks.forEach(risk => {
      risk.quote = contract.clauses[risk.clause].text;
      risk.original = risk.quote;
      risk.draft = risk.suggestion;
      risk.basis = '预设演示关注点 · 非模型审查或已核验法律结论';
    });
    contract.versions = [{ id: 'onboarding-original-v1', name: '演示原稿', time: '演示材料', clauses: copy(contract.clauses), decisions: {}, overrides: {} }];
    const project = { id: projectId, onboardingDemo: true, name: '演示项目 · 从风险到修改',
      description: '虚构合同与预设风险。体验定位原文、采纳修改、撤回和导出。',
      created: '演示材料', contractIds: [contractId], fields: {}, confirmed: {}, reviewed: true, completed: false };
    return { project, contract };
  }
  function add(data, sampleFactory, automatic = false) {
    if (!data.v2 || !Array.isArray(data.v2.projects) || !Array.isArray(data.contracts)) return null;
    if (automatic && (data.v2.onboardingDemoSeen || data.v2.projects.length || data.contracts.length)) return null;
    const existing = data.v2.projects.find(p => p.id === projectId);
    if (existing) return existing.onboardingDemo ? existing : null;
    if (data.contracts.some(c => c.id === contractId)) return null;
    const demo = create(sampleFactory);
    data.v2.projects.unshift(demo.project);
    data.contracts.push(demo.contract);
    data.v2.onboardingDemoSeen = true;
    if (!data.active) data.active = demo.contract.id;
    return demo.project;
  }
  function decide(contract, riskId, status, text) {
    if (!contract?.onboardingDemo || !['accepted', 'kept', 'open'].includes(status)) throw Error('仅支持演示合同的本地处理');
    const risk = contract.risks.find(item => item.id === riskId);
    if (!risk) throw Error('演示风险不存在');
    if (status === 'open') delete contract.decisions[riskId];
    else contract.decisions[riskId] = { status, ...(status === 'accepted' ? { text: text || risk.suggestion } : {}) };
    contract.updated = new Date().toLocaleString('zh-CN');
  }
  root.ContractReviewDemo = Object.freeze({ projectId, contractId, create, add, decide });
})(globalThis);
</script>

 }

function multiLocationBadge(c,quote){const count=reviewOccurrenceCount(c,quote);return count>1?'<span class="badge medium" data-multi-location-count="'+count+'">'+count+'处需修改</span>':'';}

function riskApplicationPlan(contract,risk){
 const issue=savedRiskIssue(contract,risk)||risk;
 if(boldIssue(issue)||boldIssue(risk))return {operation:'formatBold',formatOriginal:issue.formatOriginal||risk.quote||issue.quote};
 if(issue.draftOperation==='append'){
  const edited=decision(contract,risk).text,text=usableContractText('',edited)?edited:manualContractDraft({},issue);
  if(text)return {operation:'append',text};
 }
 const patch=riskWritePlan(contract,risk);
 return patch?{operation:'replace',...patch}:null;
}
function missingSavedDraftEntries(contract){
 const entries=[];
 for(const risk of contract.risks||[]){
  if(['accepted','kept'].includes(decision(contract,risk).status)||riskApplicationPlan(contract,risk))continue;
  const issue=savedRiskIssue(contract,risk)||{id:risk.issueId||risk.id,title:risk.title,detail:risk.why,quote:risk.quote,suggestion:risk.suggestion,severity:risk.level};
  entries.push({key:risk.id,risk,issue});
 }
 for(const entry of manualReviewEntries(contract)){
  if(!entry.issue||entry.record.applied||boldIssue(entry.issue)||manualContractDraft(entry.record,entry.issue))continue;
  entries.push({key:entry.record.ruleId,...entry});
 }
 return entries;
}

function renderRisks(){

function riskBasisLabel(r){

 if(r.basis==='模型分析 · 法规依据未核验'){const legal=current().lastLegalSearch;const record=legal?.issueSearches?.[r.issueId||r.id];if(record?.error||['failed','skipped'].includes(record?.state))return '本风险法规检索未完成 · '+(record.error||'服务未返回结果');if(record?.association?.state==='no-relevant-evidence')return '本风险已定向检索 · 未找到直接适用法条';if(record?.association?.state==='failed')return '本风险法规关联未完成 · 查看依据可重试';if(record)return '本风险已定向检索 · 查看本风险候选材料';if(legal?.materials?.length)return '本次已检索 '+legal.materials.length+' 条法规材料 · 本条未引用，查看依据可核对';if(current().legalOptions?.enabled)return '已开启法规检索 · '+(legal?.warnings?.join('；')||'本次未取得有效材料');return '模型分析 · 本次未开启自动法规检索';}

async function loadFile(file){if(!file)return;if(file.size>5*1024*1024)throw Error('文件超过 5 MB，请换一个小一点的文件。');let text='';if(/\.txt$/i.test(file.name))text=await file.text();else if(/\.docx$/i.test(file.name)){const bytes=new Uint8Array(await file.arrayBuffer()),xml=await unzipPart(bytes,'word/document.xml');const dom=new DOMParser().parseFromString(new TextDecoder().decode(xml),'application/xml');if(dom.querySelector('parsererror'))throw Error('无法读取这个 Word 文件，请使用 .docx 或 TXT。');text=[...dom.getElementsByTagNameNS('*','p')].map(p=>[...p.getElementsByTagNameNS('*','t')].map(t=>t.textContent).join('')).filter(Boolean).join('\n');}else throw Error('目前支持 .docx 或 .txt 文件。');if(!text.trim())throw Error('没有读到文字，扫描件暂时无法识别。');if(text.length>150000)throw Error('文件文字过长，请选用较短的合同。');return{name:file.name.replace(/\.[^.]+$/,''),text};}
async function unzipPart(b,name){const v=new DataView(b.buffer,b.byteOffset,b.byteLength);let end=-1;for(let p=b.length-22;p>=Math.max(0,b.length-65557);p--)if(v.getUint32(p,true)===0x06054b50){end=p;break;}if(end<0)throw Error('Word 文件格式无法读取。');let p=v.getUint32(end+16,true);const count=v.getUint16(end+10,true);for(let j=0;j<count;j++){if(v.getUint32(p,true)!==0x02014b50)break;const method=v.getUint16(p+10,true),size=v.getUint32(p+20,true),len=v.getUint32(p+28,true),nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),off=v.getUint32(p+42,true);const n=new TextDecoder().decode(b.slice(p+46,p+46+nl));if(n===name){const rawSize=v.getUint32(p+24,true);if(rawSize>8*1024*1024)throw Error('解压后文件过大，请换用较短的合同。');const start=off+30+v.getUint16(off+26,true)+v.getUint16(off+28,true),chunk=b.slice(start,start+size);if(method===0)return chunk;if(method!==8)throw Error('该 Word 压缩格式暂不支持。');try{return new Uint8Array(await new Response(new Blob([chunk]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());}catch{throw Error('当前浏览器无法解压此 Word，请另存为 TXT 后导入。');}}p+=46+nl+el+cl;}throw Error('没有找到 Word 正文，请检查文件是否完整。');}
function startReview(isNew){if(isNew&&pendingUpload?.error){$('#form-error').textContent='文件读取失败，请重新选择有效的 DOCX 或 TXT 文件。';return;}const title=$('#form-title').value.trim(),a=$('#form-a').value.trim(),b=$('#form-b').value.trim(),role=$('.role-option.selected').dataset.role,focus=$$('input[name=focus]:checked').map(x=>x.value),note=$('#form-note').value.trim();if(!title||!a||!b){$('#form-error').textContent='请补充合同名称及双方名称。';return;}let c;if(isNew){if(pendingUpload){const lines=pendingUpload.text.split(/\n+/).filter(t=>t.trim());c={id:'local-'+Date.now(),title,partyA:a,partyB:b,type:'本地导入合同',role,focus,note,clauses:lines.map((text,i)=>({title:'第 '+(i+1)+' 段',text})),risks:[],decisions:{},overrides:{},versions:[],sample:false};}else{c=sample('sample-'+Date.now(),title);Object.assign(c,{partyA:a,partyB:b,role,focus,note});}data.contracts.unshift(c);data.active=c.id;}else{c=current();Object.assign(c,{title,partyA:a,partyB:b,role,focus,note});c.decisions={};c.overrides={};}if(role==='乙方')c.risks=[];else if(c.sample)c.risks=clone(seedRisks);if(!c.versions.length)c.versions=[{id:'v1',name:'V1 · 导入原稿',time:now(),clauses:clone(c.clauses),decisions:{},overrides:{}}];persist();close();view='review';panel='risks';filter='all';statusFilter='all';selected=c.risks[0]?.id;chat=[];shell();toast(c.sample&&role==='甲方'?'已载入甲方示例审查结果':'已保存合同，当前仅预览，未运行 AI 审查');}
function locate(index){const el=$('#clause-'+index);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});$$('.clause').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');}}
function refreshReview(index){const ds=$('#doc-scroll')?.scrollTop||0,ps=$('#panel-body')?.scrollTop||0;renderReview();$('#doc-scroll').scrollTop=ds;$('#panel-body').scrollTop=ps;if(index!==undefined)locate(index);}
function setDecision(id,status,text){const c=current(),r=c.risks.find(x=>x.id===id);if(!r)return;c.decisions[id]={status,...(text?{text}:{}),time:now()};if(status==='accepted')delete c.overrides[r.clause];persist();selected=id;refreshReview(r.clause);toast({accepted:'已记录为拟采用；尚未写入WPS正文',kept:'已保留原文并记录',waiting:'已标记待确认',open:'已撤回处理，恢复为未处理'}[status]);}
function editSuggestion(id){const c=current(),r=c.risks.find(x=>x.id===id);modal('调整这条建议',`<p class="modal-sub">${esc(r.title)} · 保存后可点击「应用到原文」。</p><div class="field"><label for="suggestion-editor">修改后的条款</label><textarea id="suggestion-editor" style="min-height:210px">${esc(decision(c,r).text||savedRiskPatch(c,r)?.replacement||(c.liveReview?'':r.suggestion))}</textarea><div id="edit-error" class="error"></div></div>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="apply-edit" data-id="${id}">保存建议</button>`);}
function versions(){const c=current();$('#layers').innerHTML=`<div class="drawer-wrap"><aside class="drawer" role="dialog" aria-modal="true" aria-label="版本记录"><div class="modal-head"><h2>版本记录</h2><button class="icon-btn" data-action="close" aria-label="关闭">${icon('close')}</button></div><div class="modal-content"><p class="modal-sub">${esc(c.title)}<br>保存一个版本，就能随时对照当时的合同。</p><div class="version" style="background:#f9fafc"><div class="version-top"><strong>当前工作稿</strong><span class="badge done">自动保存</span></div><p>已处理 ${handled(c)} 条建议 · ${esc(c.updated)}<br>尚未保存为版本的修改也会保留在本机。</p><button class="btn soft" data-action="save-version">${icon('plus')}保存当前版本</button></div>${[...c.versions].reverse().map(v=>`<div class="version"><div class="version-top"><strong>${esc(v.name)}</strong><span class="badge kept">已保存</span></div><p>${esc(v.time)} · 本地演示用户</p><button class="btn" data-action="compare-version" data-id="${v.id}">与当前工作稿对比</button></div>`).join('')}</div><div class="panel-bottom">版本记录仅保存在当前浏览器中</div></aside></div>`;focusDialog();}
function saveVersionModal(){const c=current();modal('保存一个版本',`<p class="modal-sub">把当前合同和处理结果留一份，方便后续回看。</p><div class="field"><label for="version-name">版本名称</label><input id="version-name" value="V${c.versions.length+1} · 第一轮审查" maxlength="60"><div id="version-error" class="error"></div></div>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="confirm-version">保存版本</button>`);}
function compareVersion(id){const c=current(),v=c.versions.find(x=>x.id===id);const old={...c,clauses:v.clauses,decisions:v.decisions,overrides:v.overrides};const diffs=c.clauses.map((cl,i)=>({title:cl.title,before:visibleText(old,i),after:visibleText(c,i)})).filter(x=>x.before!==x.after);modal('与当前工作稿对比',`<p class="modal-sub">${esc(v.name)} → 当前工作稿 · ${diffs.length} 处条款有变化</p>${diffs.length?diffs.map(x=>`<div class="compare-section"><strong>${esc(x.title)}</strong><del><small>保存版本</small><br>${esc(x.before)}</del><ins><small>当前工作稿</small><br>${esc(x.after)}</ins></div>`).join(''):'<div class="empty">当前正文与这个版本一致。</div>'}`,`<button class="btn" data-action="versions">返回版本记录</button>`,true);}
function ask(text){if(!text.trim())return;const c=current(),r=c.risks.find(x=>x.id===selected);chat.push({role:'user',text:text.trim()});let reply;if(!r)reply='当前合同没有预设的审查结果。这是交互 Demo，尚未接入模型，暂时不能分析您导入的合同。可以切换到示例合同体验带条款的问答。';else if(/容易|退让|温和/.test(text))reply=`针对“${r.title}”，可以先与对方确认双方最关心的条件，再调整条款。\n\n示例思路：保留双方认可的基本安排，把确认时间、书面通知和整改机会写清楚。\n\n你可以点击审查卡片里的“编辑”，把最终谈好的写法存进合同。这里没有调用模型生成新的条款。`;else reply=`正在讨论：${c.clauses[r.clause].title}\n\n${r.why}\n\n建议方向：${r.suggestion}\n\n这是一条与当前风险关联的预设回答，供体验问答位置和交互。`;chat.push({role:'assistant',text:reply});renderChat();$('#panel-body').scrollTop=$('#panel-body').scrollHeight;}
function exportModal(){const c=current();modal('导出审查结果',`<p class="modal-sub">${esc(c.title)}<br>已处理 ${handled(c)} / ${c.risks.length} 条建议，${remaining(c)} 条仍需关注。</p><div class="rule-card" style="padding:15px"><h3>合同 Word 文件</h3><p>导出当前正文，或者保留已采纳建议的修改痕迹。手动修改正文也会计入对比。</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn primary" data-action="download-docx" data-redline="false">${icon('download')}干净版 .docx</button><button class="btn" data-action="download-docx" data-redline="true">${icon('edit')}带修订版 .docx</button></div></div><div class="rule-card" style="padding:15px"><h3>审查意见报告</h3><p>包含全部问题、修改建议及每条意见的处理状态，可用浏览器打开和打印。</p><button class="btn soft" style="margin-top:14px" data-action="download-report">${icon('download')}下载报告 .html</button></div><p style="font-size:10px;color:#687d8d;line-height:1.8">此 Demo 导出的是重新生成的简洁文档，不保留导入文件的原始版式。完整 Word 排版需要后续接入正式编辑器。</p>`);}
const xml=s=>String(s??'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));
function zipStored(entries){const enc=new TextEncoder(),chunks=[],central=[];let offset=0;const u16=(v,o,n)=>v.setUint16(o,n,true),u32=(v,o,n)=>v.setUint32(o,n>>>0,true);for(const [name,text]of entries){const n=enc.encode(name),b=enc.encode(text),crc=crc32(b),head=new Uint8Array(30+n.length),v=new DataView(head.buffer);u32(v,0,0x04034b50);u16(v,4,20);u16(v,6,0x800);u32(v,14,crc);u32(v,18,b.length);u32(v,22,b.length);u16(v,26,n.length);head.set(n,30);const cd=new Uint8Array(46+n.length),cv=new DataView(cd.buffer);u32(cv,0,0x02014b50);u16(cv,4,20);u16(cv,6,20);u16(cv,8,0x800);u32(cv,16,crc);u32(cv,20,b.length);u32(cv,24,b.length);u16(cv,28,n.length);u32(cv,42,offset);cd.set(n,46);chunks.push(head,b);central.push(cd);offset+=head.length+b.length;}const csize=central.reduce((a,b)=>a+b.length,0),end=new Uint8Array(22),ev=new DataView(end.buffer);u32(ev,0,0x06054b50);u16(ev,8,entries.length);u16(ev,10,entries.length);u32(ev,12,csize);u32(ev,16,offset);return new Blob([...chunks,...central,end],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});}
function crc32(b){let c=0xffffffff;for(const x of b){c^=x;for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0);}return(c^0xffffffff)>>>0;}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name.replace(/[\\/:*?"<>|]/g,'_');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('已生成下载文件');}
function makeDocx(redline){const c=current();let rev=0;const run=t=>`<w:r><w:t xml:space="preserve">${xml(t)}</w:t></w:r>`,p=(t,bold=false)=>`<w:p>${bold?'<w:pPr><w:spacing w:before="240" w:after="120"/></w:pPr><w:r><w:rPr><w:b/></w:rPr><w:t>'+xml(t)+'</w:t></w:r>':run(t)}</w:p>`;let body=p(c.title,true)+p('甲方：'+c.partyA)+p('乙方：'+c.partyB)+p('审查立场：'+c.role);for(let i=0;i<c.clauses.length;i++){const cl=c.clauses[i],t=visibleText(c,i);body+=p(cl.title,true);if(redline&&t!==cl.text){const date=new Date().toISOString();body+=`<w:p><w:del w:id="${rev++}" w:author="DSH 审查" w:date="${date}"><w:r><w:delText xml:space="preserve">${xml(cl.text)}</w:delText></w:r></w:del><w:ins w:id="${rev++}" w:author="DSH 审查" w:date="${date}">${run(t)}</w:ins></w:p>`;}else body+=p(t);}body+=p(c.sample?'虚构示例合同 · DSH 交互 Demo':'由本地 Demo 生成，版式为重新排版');const entries=[['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],['word/document.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr></w:body></w:document>`]];return zipStored(entries);}
function report(){const c=current();return `<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>${esc(c.title)} · 审查意见</title><style>body{font:14px/1.9 "Microsoft YaHei",sans-serif;max-width:850px;margin:50px auto;color:#333d44;padding:0 20px}h1{font-size:25px}h2{font-size:17px;margin-top:30px}p{white-space:pre-wrap}.note{color:#999}section{border-top:1px solid #ddd;padding:18px 0}strong{color:#56809f}@media print{body{margin:0}section{break-inside:avoid}}</style><h1>${esc(c.title)} · 审查意见</h1><p class="note">生成时间：${new Date().toLocaleString('zh-CN')}<br>代表${esc(c.role)}：${esc(c.role==='甲方'?c.partyA:c.partyB)}<br>${c.sample?'虚构合同与预设审查结果，用于演示':'本地导入文件，尚未运行 AI 审查'}</p><p>发现 ${c.risks.length} 条问题 · 已处理 ${handled(c)} 条 · 仍需处理 ${remaining(c)} 条</p>${c.risks.map((r,i)=>`<section><h2>${i+1}. ${esc(r.title)}</h2><p><strong>处理状态：</strong>${{open:'未处理',accepted:'已采纳',kept:'保留原文',waiting:'待确认'}[decision(c,r).status]}</p><p><strong>合同原文：</strong>${esc(c.clauses[r.clause].text)}</p><p><strong>为什么要关注：</strong>${esc(r.why)}</p><p><strong>修改建议：</strong>${esc(decision(c,r).text||r.suggestion)}</p><p><strong>当前正文：</strong>${esc(visibleText(c,r.clause))}</p></section>`).join('')}</html>`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b){if(e.target.classList.contains('overlay')||e.target.classList.contains('drawer-wrap'))close();return;}const a=b.dataset.action,c=current(),id=b.dataset.id;switch(a){case'nav':view=b.dataset.view;editingClause=null;shell();break;case'panel':panel=b.dataset.tab;renderReview();break;case'mobile':mobile=b.dataset.tab;refreshReview();break;case'filter':filter=b.dataset.filter;renderRisks();break;case'list-filter':listFilter=b.dataset.filter;renderLibrary();break;case'open-contract':data.active=id;persist();view='review';panel='risks';filter='all';statusFilter='all';selected=current().risks[0]?.id;chat=[];editingClause=null;shell();break;case'select-risk':selected=id;panel='risks';renderRisks();locate(c.risks.find(r=>r.id===id)?.clause);break;case'locate':mobile='doc';if(innerWidth<=800)refreshReview(Number(b.dataset.index));else locate(Number(b.dataset.index));break;case'accept':{const r=c.risks.find(x=>x.id===id);if(Object.hasOwn(c.overrides,r.clause)){modal('用建议替换手动修改？','<p class="modal-sub">这条正文已被手动编辑。采纳后会使用建议写法；已有保存版本不会改变。</p>',`<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="accept-confirm" data-id="${id}">确认替换</button>`);}else setDecision(id,'accepted',decision(c,r).text||r.suggestion);break;}case'accept-confirm':{const r=c.risks.find(x=>x.id===id);close();setDecision(id,'accepted',decision(c,r).text||r.suggestion);break;}case'keep':setDecision(id,'kept');break;case'waiting':setDecision(id,decision(c,c.risks.find(r=>r.id===id)).status==='waiting'?'open':'waiting');break;case'undo':{const r=c.risks.find(x=>x.id===id);delete c.overrides[r.clause];setDecision(id,'open');break;}case'edit-suggestion':editSuggestion(id);break;case'apply-edit':{const t=$('#suggestion-editor').value.trim();if(!t){$('#edit-error').textContent='请填写修改后的条款。';break;}close();setDecision(id,'open',t);break;}case'toggle-changes':showChanges=!showChanges;refreshReview();break;case'manual-edit':editingClause=Number(b.dataset.index);refreshReview(editingClause);$('#clause-editor').focus();break;case'cancel-clause':editingClause=null;refreshReview();break;case'save-clause':{const i=Number(b.dataset.index),t=$('#clause-editor').value.trim();if(!t){toast('条款内容不能为空');break;}c.overrides[i]=t;const r=c.risks.find(x=>x.clause===i);if(r)c.decisions[r.id]={status:'waiting',time:now()};persist();editingClause=null;refreshReview(i);toast('正文已保存；相关审查意见标为待确认');break;}case'summary':panel='summary';mobile='risk';refreshReview();break;case'ask-risk':selected=id;panel='chat';mobile='risk';renderReview();break;case'prompt':ask(b.dataset.prompt);break;case'send-chat':ask($('#chat-text').value);break;case'new':settings(true);break;case'settings':settings(false);break;case'role':$$('.role-option').forEach(x=>x.classList.toggle('selected',x===b));break;case'start-review':startReview(b.dataset.new==='true');break;case'close':close();break;case'versions':versions();break;case'save-version':saveVersionModal();break;case'confirm-version':{const name=$('#version-name').value.trim();if(!name){$('#version-error').textContent='请填写版本名称。';break;}c.versions.push({id:'v'+Date.now(),name,time:now(),clauses:clone(c.clauses),decisions:clone(c.decisions),overrides:clone(c.overrides)});persist();close();refreshReview();toast('版本已保存');break;}case'compare-version':compareVersion(id);break;case'export':exportModal();break;case'download-docx':download(makeDocx(b.dataset.redline==='true'),c.title+(b.dataset.redline==='true'?'（带修订）':'（修改稿）')+'.docx');break;case'download-report':download(new Blob([report()],{type:'text/html;charset=utf-8'}),c.title+'（审查意见）.html');break;case'sample':data.active=data.contracts.find(x=>x.id==='sample-web')?.id||data.contracts[0].id;view='review';panel='risks';selected=current().risks[0]?.id;filter='all';statusFilter='all';close();shell();break;case'about':modal('关于这个 Demo','<p class="modal-sub">这是合同审查工作台的本地交互原型。</p><div class="info-list"><dt>可以体验</dt><dd>合同管理、条款定位、处理建议、手动修改、版本对比及文件导出。</dd><dt>示例数据</dt><dd>合同、公司及审查意见均为虚构，AI 问答为预设回答。</dd><dt>本地文件</dt><dd>导入和保存都在当前浏览器完成。没有后端，也不会上传文件。</dd><dt>后续接入</dt><dd>真实 AI 审查、WPS / ONLYOFFICE 编辑器、Bisheng 账号权限和多人协作。</dd></div>','<button class="btn primary" data-action="close">开始体验</button>');break;}});
document.addEventListener('input',e=>{if(e.target.id==='contract-search'){search=e.target.value;renderRows();}if(e.target.id==='form-a')$('#display-party-a').textContent=e.target.value||'待填写';if(e.target.id==='form-b')$('#display-party-b').textContent=e.target.value||'待填写';});
document.addEventListener('change',async e=>{if(e.target.id==='status-filter'){statusFilter=e.target.value;renderRisks();}if(e.target.id==='upload-file'){const file=e.target.files[0];pendingUpload=null;$('#upload-error').textContent='';$('#start-review').disabled=true;$('#upload-name').textContent='正在本地读取文件…';try{pendingUpload=await loadFile(file);if(!pendingUpload){$('#upload-name').textContent='未选择文件，将使用示例合同';return;}$('#form-title').value=pendingUpload.name;$('#upload-name').textContent='已导入：'+file.name+' · '+Math.ceil(file.size/1024)+' KB';$('#form-a').value='';$('#form-b').value='';$('#display-party-a').textContent='请填写甲方名称';$('#display-party-b').textContent='请填写乙方名称';}catch(err){$('#upload-error').textContent=err.message;$('#upload-name').textContent='读取失败，请重新选择文件';pendingUpload={error:true};}finally{$('#start-review').disabled=false;}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.id==='chat-text'&&!e.shiftKey){e.preventDefault();ask(e.target.value);}if(e.key==='Tab'&&$('#layers').children.length){const nodes=$$('#layers button,#layers input:not([type=file]),#layers textarea,#layers select').filter(x=>!x.disabled&&x.getClientRects().length),first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});

<script>
/* Local interactive prototype. No model, legal database or network calls. */
(async () => {
await restoreSavedState();
const old = {shell, review:renderReview, risks:renderRisks, panel:renderPanel, risk:riskHTML, clause:clauseHTML, summary:renderSummary, settings, persist, decision:setDecision, report, docx:makeDocx, exports:exportModal, chat:ask};
const uid = p => p + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7);
const tag = (s,t='') => `<span class="v2-badge ${t}">${esc(s)}</span>`;
const action = (name,label,id='',style='') => `<button class="btn ${style}" data-v2="${name}" data-id="${esc(id)}">${label}</button>`;
const notes = '本地合同 · DSH 模型审查 · 法规依据待核验';
let activeProject='p-service', ruleTab='t-service', projectQuery='', projectFilter='all', ruleQuery='', newFiles=[], uploadBusy=false, draftMode='sample', draftTemplate='t-service';
let templateSelection=null;
const defaults=()=>({rules:[],templates:[],projects:[],schema:2});
const realBundle={version:1002,projects:[],contracts:[],templates:[],rules:[]};
if(!data.v2||data.v2.realSourceVersion!==1002){data={contracts:[],active:'',v2:{...defaults(),realSourceVersion:1002}};localStorage.setItem(STORE,JSON.stringify(data));}
activeProject=data.v2.projects[0]?.id||'';ruleTab=data.v2.templates[0]?.id||'';draftTemplate=data.v2.templates[0]?.id||'';
const st=()=>data.v2;
const proj=()=>st().projects.find(p=>p.id===activeProject)||st().projects[0];
// Refresh only previously missing legacy previews; preserve user work.
for(const c of data.contracts){const src=realBundle.contracts.find(x=>x.id===c.id);if(c.realSource&&c.parsePending&&src&&c.clauses.every(x=>x.title==='待解析原件'))c.clauses=clone(src.clauses);}
function preferredContract(p){const list=docs(p);return list.find(c=>c.kind!=='aux'&&!c.parsePending)||list.find(c=>c.kind!=='aux')||list[0];}
const docs=p=>(p||proj()).contractIds.map(id=>data.contracts.find(c=>c.id===id)).filter(Boolean);
const tpl=id=>st().templates.find(t=>t.id===id);
const rule=id=>st().rules.find(r=>r.id===id);
const draftRules=t=>(t?.ruleIds||[]).map(rule).filter(Boolean);
const cProject=c=>st().projects.find(p=>p.contractIds.includes(c.id));
const source=c=>c.realSource?(c.parsePending?'来源原件 · 正文待解析':'来源合同 · 待审查'):c.kind==='guarantee'?'保证合同示例':c.kind==='loan'?'贷款合同示例':c.kind==='aux'?'辅助材料':c.sample?'采购合同示例':'本地导入 · 未运行 AI';
const rowsSnapshot=c=>!c.templateId?{name:'AI 通用审查',reviewMode:'general',version:1,rules:generalReviewRules(),time:now()}:({name:tpl(c.templateId)?.name||'未选模板',version:tpl(c.templateId)?.version||0,rules:(c.ruleIds||[]).map(rule).filter(r=>r?.enabled).map(r=>clone(r)),time:now()});
const save=()=>saveState()===true;
persist=()=>{current().updated=now();return save();};
function openDoc(id,tab='risks'){const c=data.contracts.find(x=>x.id===id);if(!c)return;data.active=id;activeProject=cProject(c)?.id||activeProject;view='review';panel=tab==='checks'?'risks':tab;selected=c.risks[0]?.id;filter='all';statusFilter='all';editingClause=null;chat=clone(c.liveChat||[]);mobile='risk';save();shell();}
function status(p){if(p.completed)return '已完成';if(!p.reviewed)return Object.keys(p.confirmed||{}).length?'待审查':'待核对';if(docs(p).some(c=>c.needsReview))return '待复查';return docs(p).some(c=>remaining(c)>0||!c.sample)?'待处理':'待确认完成';}
function header(title,sub,right=''){return `<div class="v2-head"><div><div class="v2-eyebrow">CONTRACT WORKSPACE</div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div><div class="v2-actions">${right}</div></div>`;}
function run(c){
 if(c.kind==='aux')return;
 // Preserve the actual work text even when a resolved risk leaves the new list.
 c.risks.forEach(r=>{if(decision(c,r).status==='accepted'&&!Object.hasOwn(c.overrides,r.clause))c.overrides[r.clause]=decision(c,r).text||r.suggestion;});
 c.snapshot=rowsSnapshot(c);c.checks=[];
 const oldRisks=clone(c.risks), next=[];
 for(const r of c.snapshot.rules){
  let result='unable',detail='需要模型判断；本地 Demo 不执行真实 AI 审查。',risk=null;
  if(c.sample&&c.kind==='service'&&seedRisks.some(x=>x.id===r.id)){
   const sr=seedRisks.find(x=>x.id===r.id);risk={...clone(sr),ruleId:r.id,basis:r.category+' · '+r.requirement,suggestion:r.preferred};
   const actual=visibleText(c,sr.clause);result=actual===seedClauses[sr.clause].text?'risk':'recheck';detail=result==='risk'?'命中预设样例问题。':'正文已有变化，需要人工确认；不自动当作已通过。';
  }else if(c.sample&&c.kind==='service'&&r.id==='supplier-payment'){
   risk={id:r.id,ruleId:r.id,clause:1,level:r.level,title:r.name,why:'当前示例未约定当期付款的催告与暂停服务安排，可从供应方立场补充。',suggestion:r.preferred,basis:'企业规则 · 供应方收款保障'};result='risk';detail='供应方预设样例；与委托方清单不同。';
  }else if(c.sample&&r.id==='amount-link'){
   const p=cProject(c),loan=docs(p).find(x=>x.kind==='loan');
   const a=loan&&extract(loan,'amount'),b=extract(c,'amount');
   if(a&&b){result=a===b?'pass':'risk';detail=a===b?'关联借款金额在两份原文中一致。':`贷款合同 ${a} / 保证合同 ${b}。`;
    if(result==='risk')risk={id:r.id,ruleId:r.id,clause:1,level:r.level,title:r.name,why:detail+' 这两处均指向 YC-2026-031 的同一笔借款，请确认原件后修改。',suggestion:r.preferred,basis:'跨文件核对 · 原文金额',relatedId:loan.id};
   }else detail='缺少关联合同或无法提取金额。';
  }else if(c.sample&&r.id==='loan-id'){
   const p=cProject(c),other=docs(p).find(x=>x.kind==='guarantee');
   result=other&&extract(c,'number')===extract(other,'number')?'pass':'unable';detail=result==='pass'?'贷款与保证合同均引用 YC-2026-031。':'缺少可核对的关联编号。';
  }else if(c.sample&&r.id==='authorization'){result='unable';detail='已有公司章程，缺少本次保证对应的决议文件。';}
  else if(r.id==='law-check'){result='failed';detail='法规库未接入，尚未执行法律核验。';}
  if(risk){const previous=oldRisks.find(x=>x.id===risk.id);next.push({...previous,...risk});}
  c.checks.push({ruleId:r.id,name:r.name,result,detail});
 }
 c.risks=next;c.needsReview=false;c.lastRun=now();
 c.runs||=[];c.runs.push({time:c.lastRun,snapshot:clone(c.snapshot),checks:clone(c.checks),risks:clone(c.risks),decisions:clone(c.decisions)});
}
function extract(c,key){
 const text=c.clauses.map((_,i)=>visibleText(c,i)).join('\n');
 if(key==='amount'){const total=text.match(/(?:合同(?:含税)?总价|合同总金额|合同金额|总价)[^\n]{0,10}?([\d,，.]+\s*(?:亿元|万元|元))/);if(total)return total[1].replace(/\s|，/g,'');return text.match(/(?:人民币|贷款本金金额)[^\n]{0,12}?([\d,，.]+\s*(?:亿元|万元|元))/)?.[1]?.replace(/\s|，/g,'')||'';}
 if(key==='number')return text.match(/(?:主合同|贷款合同)[^\n]{0,24}?(?:编号|号)[：:\s【\[]*([A-Za-z0-9][A-Za-z0-9－—\-]{3,})/)?.[1]||'';
 if(key==='contractNumber')return text.match(/(?:合同编号|编号)[：:\s【\[]*([A-Za-z0-9][A-Za-z0-9－—\-]{3,})/)?.[1]||'';
 if(key==='partyA'||key==='partyB'){const saved=c[key];if(saved&&saved!=='待核对')return saved;const label=key==='partyA'?'甲\\s*方|债\\s*权\\s*人|贷款人|受托人':'乙\\s*方|保\\s*证\\s*人|借款人|保管人';return text.match(new RegExp('(?:'+label+')[\\s（(]*(?:[^\\n：:]{0,20}[）)])?[\\s：:]+([^\\n]{2,90})'))?.[1]?.trim()||'';}
 return '';
}
function fields(p){
 const ds=docs(p).filter(c=>c.kind!=='aux');
 const keys=[['partyA','甲方 / 债权人'],['partyB','乙方 / 相对方'],['amount','关联借款金额 / 合同金额'],['contractNumber','合同自身编号'],['number','关联主合同编号（无明确引用可不填）']];
 return keys.map(([key,label])=>({key,label,values:ds.map(c=>({c,value:p.fields?.[c.id+':'+key]?.value??extract(c,key),original:extract(c,key),confirmed:!!p.confirmed?.[c.id+':'+key]}))}));
}
function invalidate(c,clearFields=true){c.needsReview=true;const p=cProject(c);p.completed=false;if(clearFields)Object.keys(p.confirmed).filter(k=>k.startsWith(c.id+':')).forEach(k=>delete p.confirmed[k]);(c.checks||[]).forEach(k=>k.result='recheck');if(c.kind==='loan'||c.kind==='guarantee')docs(p).filter(d=>d.id!==c.id&&d.kind!=='aux').forEach(d=>d.needsReview=true);}
shell=function(){
 old.shell();
 $('.rail-nav').innerHTML=`<button class="nav ${view==='projects'||view==='project'?'active':''}" data-v2="projects">${icon('folder')}<span>项目与合同</span></button><button class="nav ${view==='review'||view==='elements'?'active':''}" data-v2="review-home">${icon('shield')}<span>审查工作区</span></button><button class="nav ${view==='rules'?'active':''}" data-v2="rules">${icon('sliders')}<span>审查模板</span></button>`;
 $('.file-title').innerHTML=icon('file')+esc(view==='projects'?'项目与合同':view==='project'?proj().name:view==='elements'?'关键要素核对':view==='rules'?'审查模板':current().title);
 if(view!=='review')$('.topbar .actions').innerHTML=action('new-project','＋ 新建审查','','primary');
 if(view==='projects')renderProjects();
 if(view==='project')renderProject();
 if(view==='elements')renderElements();
 if(['project','elements','review'].includes(view)){
  const p=view==='review'?cProject(current()):proj();if(p)activeProject=p.id;
  $('.topbar').insertAdjacentHTML('afterend',`<div class="v2-stepbar"><span class="v2-project-name">${esc(p?.name||'合同审查')}</span>${[['project','1 材料与模板'],['elements','2 要素核对'],['review','3 审查与修改']].map(([v,l])=>`<button class="${view===v?'active':''}" data-v2="stage" data-id="${v}">${l}</button>`).join('')}<button data-v2="similar">${icon('history')} 历史比较</button><button data-v2="project-export">项目导出</button></div>`);
 }
};
function renderProjects(){
 const ps=st().projects.filter(p=>(!projectQuery||[p.name,...docs(p).map(c=>c.title+' '+c.partyA+' '+c.partyB)].join(' ').toLowerCase().includes(projectQuery.toLowerCase()))&&(projectFilter==='all'||(projectFilter==='done'?p.completed:!p.completed)));
 $('#content').innerHTML=`<section class="v2-page">${header('项目与合同','从一份合同开始，也可以把同一项目的材料放在一起。',action('new-project','＋ 新建审查','','primary'))}<div class="v2-stats"><div class="v2-stat"><span>全部项目</span><strong>${st().projects.length.toString().padStart(2,'0')}</strong></div><div class="v2-stat"><span>待核对 / 待处理</span><strong>${st().projects.filter(p=>!p.completed).length.toString().padStart(2,'0')}</strong></div><div class="v2-stat"><span>合同与辅助材料</span><strong>${data.contracts.length.toString().padStart(2,'0')}</strong></div></div><div class="v2-toolbar"><div class="choice-row">${[['all','全部项目'],['pending','待处理'],['done','已完成']].map(([i,t])=>action('project-filter',t,i,projectFilter===i?'soft':'')).join('')}</div><input aria-label="搜索项目或合同" id="v2-project-search" placeholder="搜索项目、合同或签约方" value="${esc(projectQuery)}"></div><div class="v2-grid">${ps.map(p=>`<article class="v2-card"><div class="v2-row v2-between"><div class="v2-icon">${icon('folder')}</div>${tag(status(p),p.completed?'green':'amber')}</div><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><div class="v2-row v2-gap">${tag(docs(p).filter(c=>c.kind!=='aux').length+' 份合同')}${docs(p).some(c=>c.kind==='aux')?tag('含辅助材料'):''}</div><div class="v2-card-foot"><span class="v2-sub">${p.created} · ${docs(p).reduce((n,c)=>n+remaining(c),0)} 项意见待处理</span>${action('open-project','打开项目 →',p.id,'soft')}</div></article>`).join('')||'<div class="v2-card"><p>没有匹配的项目，换个名称试试。</p></div>'}</div><div class="v2-note">${notes}。来源原件仅在本机保存；调用模型或打开WPS时会发送至相应服务。审查结果初始为空。</div></section>`;
}

function renderElements(){const p=proj(),fs=fields(p),ds=docs(p).filter(c=>c.kind!=='aux');const n=fs.reduce((s,f)=>s+f.values.filter(v=>v.confirmed).length,0);$('#content').innerHTML=`<section class="v2-page">${header('先把关键信息核对清楚','点击提取值查看原文。更正核对值不会直接修改合同正文。',action('run-selected','确认后开始审查','','primary'))}<div class="v2-project-banner"><div><strong>${esc(p.name)}</strong><p>已确认 ${n} / ${fs.length*ds.length} 个字段 · ${ds.length} 份合同</p></div><div class="v2-actions">${action('confirm-fields','确认已提取字段','','soft')}${action('csv','导出核对表')}</div></div><div class="v2-table-wrap"><table class="v2-table"><thead><tr><th>核对字段</th>${ds.map(c=>`<th>${esc(c.title)}</th>`).join('')}<th>核对提示</th></tr></thead><tbody>${fs.map(f=>{const vals=f.values.map(v=>v.value);const conflict=f.key==='amount'&&ds.some(c=>c.kind==='loan')&&ds.some(c=>c.kind==='guarantee')&&new Set(vals.filter(Boolean)).size>1;return `<tr class="${conflict?'conflict':''}"><td>${esc(f.label)}</td>${f.values.map(v=>`<td><input aria-label="${esc(f.label)}" data-inline-contract="${v.c.id}" data-inline-key="${f.key}" value="${esc(v.value||'')}" placeholder="未提取，请填写或查看原文" style="width:100%;max-width:420px"><span class="field-status">${v.confirmed?'已确认':'可直接修改'}</span>${p.fields?.[v.c.id+':'+f.key]?'<small class="v2-sub">人工更正 · 原值 '+esc(v.original||'未提取')+'</small>':''}</td>`).join('')}<td>${conflict?tag('同一借款金额不一致','red'):f.key==='partyB'?'<span class="v2-sub">各文件相对方可以不同</span>':f.key==='number'?'<span class="v2-sub">仅比较明确关联的编号</span>':'<span class="v2-sub">请结合原文确认</span>'}</td></tr>`}).join('')}</tbody></table></div><div class="v2-note">这里更正的是核对记录。正式审查仍以合同原文为准；如果原文有错，需要回到合同修改并重新核对。</div></section>`;}
function fieldDialog(id,key){const p=proj(),c=data.contracts.find(x=>x.id===id),original=extract(c,key),v=p.fields?.[id+':'+key]?.value??original;const idx=c.clauses.findIndex((_,i)=>visibleText(c,i).includes(original)&&!!original);modal('核对提取值',`<p class="modal-sub">${esc(c.title)} · ${esc(key==='amount'?'金额':key==='number'?'关联主合同编号':key==='contractNumber'?'合同自身编号':key==='partyA'?'甲方 / 债权人':'乙方 / 相对方')}</p><div class="quote">${esc(visibleText(c,Math.max(idx,0)))}</div><p class="v2-sub" style="margin:12px 0">原始提取值：${esc(original||'未提取')}。修改核对值不会改动原文。</p><div class="field"><label for="v2-field-value">确认值</label><input id="v2-field-value" value="${esc(v)}" maxlength="160"></div><div id="v2-error" class="error"></div>`,action('save-field','保存并确认',id,'primary').replace('data-id=',`data-key="${key}" data-id=`));}
renderRules=function(){const t=tpl(ruleTab)||st().templates[0];if(!t){$('#content').innerHTML='<section class="v2-page">'+header('审查模板','暂无审核模板，请先新建模板或让 AI 整理公司的审查要求。')+'<div class="v2-card"><p>模板库当前为空。创建模板后，可添加审查点并在合同设置中选择。</p></div></section>';return;}ruleTab=t.id;const rs=draftRules(t).filter(r=>!ruleQuery||[r.name,r.requirement].join('').includes(ruleQuery));$('#content').innerHTML=`<section class="v2-page">${header('审查模板','左侧是审查模板；右侧是所选模板包含的检查项。模板按合同类型和我方身份组织，可复制后调整。',action('copy-template','复制模板',t.id)+action('new-rule','＋ 新增审查点','','primary'))}<div class="v2-rule-layout"><div class="v2-templates">${st().templates.map(x=>`<button class="v2-template ${x.id===t.id?'active':''}" data-v2="template" data-id="${x.id}"><strong>${esc(x.name)}</strong><small>${esc(x.scope)} · ${x.ruleIds.length} 项 · V${x.version}</small></button>`).join('')}</div><div><div class="v2-card" style="margin-bottom:15px"><div class="v2-row v2-between"><div><strong>${esc(t.name)}</strong><p>${esc(t.type)} · ${esc(t.identity)} · ${esc(t.region)}</p></div>${tag('V'+t.version)}</div><div class="v2-actions v2-gap">${action('apply-current','应用到当前合同',t.id)}</div></div><div class="v2-toolbar"><span class="v2-sub">${rs.length} 条规则（模板内检查项）</span><input id="v2-rule-search" aria-label="搜索审查点" value="${esc(ruleQuery)}" placeholder="搜索审查点"></div><div class="v2-list">${rs.map(r=>`<article class="v2-check"><div class="v2-row v2-between"><h4>${esc(r.name)}</h4>${r.realSource?tag('来源检查项'):tag({high:'高风险',medium:'中风险',low:'低风险'}[r.level],r.level==='high'?'red':'')}</div><p>${esc(r.requirement)}</p><div class="v2-row v2-between"><span class="v2-sub">${esc(r.category)} · V${r.version}${r.enabled?'':' · 已停用'}</span><div class="v2-actions">${action('edit-rule','编辑',r.id)}${action('toggle-rule',r.enabled?'停用':'启用',r.id)}</div></div></article>`).join('')||'<div class="v2-card"><p>没有匹配的审查点。</p></div>'}</div><div class="v2-note">规则修改不会悄悄改变历史审查。本地自定义规则可保存、选用和试验；语义判断显示“需要 AI”，不会伪造命中。</div></div></div></section>`;};
function ruleEditor(id){const r=rule(id);modal(r?'编辑审查点':'新增审查点',`<div class="field"><label>审查点名称</label><input id="v2-rule-name" maxlength="80" value="${esc(r?.name||'')}"></div><div class="v2-two"><div class="field"><label>规则来源</label><select id="v2-rule-category">${['企业规则','跨文件核对','辅助材料','法律法规'].map(x=>`<option ${r?.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>风险等级</label><select id="v2-rule-level">${[['high','高风险'],['medium','中风险'],['low','低风险']].map(([v,l])=>`<option value="${v}" ${r?.level===v?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="field"><label>检查什么，什么情况需要提醒？</label><textarea id="v2-rule-req" maxlength="2000">${esc(r?.requirement||'')}</textarea></div><div class="field"><label>希望怎么改</label><textarea id="v2-rule-preferred" maxlength="4000">${esc(r?.preferred||'')}</textarea></div><div class="field"><label>可以让步的写法（选填）</label><textarea id="v2-rule-fallback" maxlength="4000">${esc(r?.fallback||'')}</textarea></div><div id="v2-error" class="error"></div><p class="v2-sub">保存在当前浏览器；启用后可加入模板。本地不执行语义审查。</p>`,action('close','取消')+action('save-rule','保存审查点',id||'','primary'),true);}
settings=function(isNew=false){if(isNew){newProject();return;}configure(current().id);};
let pendingReview=null;
const reviewStrengths={强势:'优先争取我方有利条款和履约保障',均势:'优先建议双方对等、可协商的条款',弱势:'优先守住我方关键底线，其他问题建议最小必要修改'};

function configure(id){const c=data.contracts.find(x=>x.id===id),t=tpl(c.templateId)||{id:'',ruleIds:[]};for(const key of ['partyA','partyB'])c[key]=cProject(c)?.fields?.[c.id+':'+key]?.value??extract(c,key);templateSelection={id,candidate:t.id,ids:clone(c.ruleIds||t.ruleIds)};modal('审查设置',`<p class="modal-sub">${esc(c.title)} · 为当前合同选择模板和检查项。</p><div class="field"><label>审查模板</label><select id="v2-config-template"><option value="">不使用模板 · AI 通用审查</option>${st().templates.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${esc(x.name)} · V${x.version}</option>`).join('')}</select></div><div class="v2-two"><div class="field"><label for="v2-party-a">甲方名称</label><input id="v2-party-a" maxlength="150" value="${esc(c.partyA)}"></div><div class="field"><label for="v2-party-b">乙方名称</label><input id="v2-party-b" maxlength="150" value="${esc(c.partyB)}"></div></div><div class="v2-two"><div class="field"><label>代表哪一方</label><select id="v2-config-role"><option value="甲方" ${c.role==='甲方'?'selected':''}>甲方 · ${esc(c.partyA)}</option><option value="乙方" ${c.role==='乙方'?'selected':''}>乙方 · ${esc(c.partyB)}</option></select></div><div class="field"><label>适用地区</label><input value="中国大陆" readonly></div></div><fieldset class="review-strength" aria-describedby="review-strength-help review-strength-note"><legend>审查力度</legend><p class="review-strength-help" id="review-strength-help">根据我方谈判地位选择，影响修改建议的取向。</p><div class="review-strength-options">${[["强势","争取我方更充分的保障"],["均势","平衡双方权利与义务"],["弱势","守住关键底线，减少改动"]].map(([level,description],index)=>`<label><input type="radio" name="v2-review-strength" value="${level}" aria-describedby="review-strength-description-${index}" ${reviewStrength(c)===level?"checked":""}><span class="review-strength-card"><strong>${level}</strong><small id="review-strength-description-${index}">${description}</small></span></label>`).join("")}</div><p class="review-strength-note" id="review-strength-note">各档均会提示重大风险。</p></fieldset><div class="field v2-gap"><label>本次检查特别要求</label><textarea id="v2-config-note" maxlength="1500">${esc(c.note||'')}</textarea></div><div class="v2-list" id="v2-config-rules">${configRules()}</div><p class="v2-sub">保存只改变本次清单，正文和历史版本保留。旧意见将标记为需要重新检查。</p>`,action('close','取消')+action('save-config',pendingReview?'保存并开始审查':'保存设置',id,'primary'),true);}
function configRules(){if(!templateSelection.candidate)return '<div class="readable-card"><h4>AI 通用审查</h4><p>无需预设公司模板。AI 将结合全文检查主体、付款、交付验收、质量、违约、解除和争议等问题。以下为通用范围，不代表公司制度或合规结论。</p><p>'+generalReviewRules().map(r=>esc(r.name)).join(' · ')+'</p></div>';const groups=new Map();const selectedTemplate=tpl(templateSelection.candidate);const allowed=new Set(selectedTemplate?.ruleIds||[]);for(const r of st().rules.filter(r=>r.enabled&&(allowed.has(r.id)||templateSelection.ids.includes(r.id)))){const category=/主体|名称|身份|资信|存续|经营范围|股权关系/.test(r.name)?'合同主体与资格':/金额|费用|税|付款|利息|利率/.test(r.name)?'金额与费用':/保证|抵押|质押|担保|债权/.test(r.name)?'担保与债权':/签署|签订|生效|份数|盖章/.test(r.name)?'签署与生效':/违约|解除|终止|争议|送达|通知|不可抗力/.test(r.name)?'履行与争议':'条款与文本核对';if(!groups.has(category))groups.set(category,[]);groups.get(category).push(r);}return '<p class="v2-sub">仅显示当前模板及已选检查项，展开类别后可逐项调整。</p>'+[...groups].map(([name,rs])=>`<details class="v2-check"><summary style="cursor:pointer;padding:8px"><strong>${esc(name)}</strong> · ${rs.length}项</summary>${rs.map(r=>`<div style="padding:8px;border-top:1px solid #eee"><label><input type="checkbox" name="v2-rule" value="${r.id}" ${templateSelection.ids.includes(r.id)?'checked':''}> ${esc(r.name)}</label><details style="margin:6px 24px;font-size:12px"><summary>查看检查标准</summary><p>${esc(r.requirement)}</p></details></div>`).join('')}</details>`).join('');}

 if(!c.risks.length&&!manualReviewEntries(c).length&&c.kind!=='service')$('.risk-list').innerHTML=`<div class="empty">${icon('shield')}<p>${c.kind==='aux'?'这是辅助材料，不单独运行审查':c.lastRun?'当前没有风险意见':'先核对材料，再开始模型审查'}</p>${c.kind==='aux'?'':action('run-current','开始审查','','soft')}</div>`;
};
document.addEventListener('change',event=>{
 const field=event.target.closest('textarea[data-manual-draft]'),c=current();
 if(!field||field.dataset.contractId!==c.id)return;
 const entry=manualReviewEntries(c).find(({record})=>record.ruleId===field.dataset.manualDraft);
 if(entry){
  const {record,issue}=entry;
  record.draftOriginal=manualDraftOriginal(record,issue);
  record.draft=field.value;
  const button=field.closest('.risk-card')?.querySelector('[data-apply-manual-draft]');
  if(button&&!record.applied)button.innerHTML=icon('check')+('应用到原文');
  save();
 }
});
document.addEventListener('click',async event=>{
 const button=event.target.closest('[data-copy-manual-draft],[data-edit-manual-draft]');
 if(!button)return;
 const card=button.closest('.risk-card'),field=card.querySelector('[data-manual-draft]');
 const preview=card.querySelector('.manual-draft-preview'),edit=card.querySelector('[data-edit-manual-draft]');
 const setEditing=editing=>{
  field.hidden=!editing;preview.hidden=editing;
  preview.textContent=field.value.trim()||'可填写补充条款';
  edit.setAttribute('aria-expanded',String(editing));
  edit.innerHTML=icon('edit')+(editing?'完成':'编辑');
  if(editing)field.focus();
 };
 if(button===edit){setEditing(field.hidden);return;}
 if(!field.value.trim()){toast('请输入要复制的内容');return;}
 try{await navigator.clipboard.writeText(field.value);toast('已复制');}

async function insertWpsSuggestion(instance,text){

 await instance.ready();const doc=instance.Application.ActiveDocument,selection=doc.ActiveWindow.Selection;
 const before=await doc.Revisions.Count,end=await selection.Range.End;

 await selection.InsertAfter(text);
 const after=await doc.Revisions.Count;let revision=null;
 if(after===before+1){for(let i=1;i<=after;i++){const candidate=doc.Revisions.Item(i),range=await candidate.Range;if(await range.Text===text&&await range.Start===end){revision=candidate;break;}}}

}

function formattedSummary(text){const blocks=String(text).replace(/\r/g,'').split(/\n(?=\s*(?:#{1,4}\s|[1-9][、.．\s]?[\u4e00-\u9fff]))/).filter(x=>x.trim());return blocks.map((block,i)=>{block=block.trim();const m=block.match(/^(?:#{1,4}\s*)?(?:[1-9][、.．\s]?)?([^\n：:]{2,24})[：:]\s*([\s\S]*)$/);if(i===0&&!/^[1-9#]/.test(block))return '<div class="summary-lead">'+safeRichText(block)+'</div>';return '<section class="readable-card">'+(m?'<h4>'+safeRichText(m[1])+'</h4><p>'+safeRichText(m[2])+'</p>':'<p>'+safeRichText(block)+'</p>')+'</section>';}).join('');}

function lawItems(result){
 const unpack=value=>{
  if(Array.isArray(value))return value.filter(item=>item&&typeof item==='object');
  if(!value||typeof value!=='object')return null;
  for(const key of ['items','results','result','data']){const items=unpack(value[key]);if(items?.length)return items;}
  return value.title||value.heading||value.lawTitle||value.law_title||value.name||value.doc_no?[value]:null;
 };
 const structured=unpack(result.structuredContent);if(structured?.length)return structured;
 const items=[];
 for(const block of result.content||[]){
  if(block.type!=='text'||typeof block.text!=='string')continue;
  try{const parsed=unpack(JSON.parse(block.text));if(parsed)items.push(...parsed);continue;}catch{}
  // Older saved searches contain multiple JSON documents joined with newlines.
  let start=-1,depth=0,quoted=false,escaped=false;
  for(let i=0;i<block.text.length;i++){
   const char=block.text[i];
   if(quoted){if(escaped)escaped=false;else if(char==='\\')escaped=true;else if(char==='"')quoted=false;continue;}
   if(char==='"'&&depth){quoted=true;continue;}
   if(char==='{'||char==='['){if(depth===0)start=i;depth++;}
   else if((char==='}'||char===']')&&depth){depth--;if(depth===0){try{const parsed=unpack(JSON.parse(block.text.slice(start,i+1)));if(parsed)items.push(...parsed);}catch{}}}
  }
 }
 return items.length?items:null;
}
function lawSourceUrl(item){
 for(const candidate of [item.url,typeof item.citation==='string'?item.citation:item.citation?.url,item.sourceUrl,item.source_url,item.link,item.href,item.originalUrl,item.original_url,item.detailUrl,item.detail_url]){
  if(typeof candidate!=='string'||!candidate.trim())continue;
  try{const url=new URL(candidate);if(['https:','http:'].includes(url.protocol)&&!url.username&&!url.password)return url.href;}catch{}
 }
 return '';
}
function lawResultHTML(result){
 const items=lawItems(result);if(!items)return '<div class="readable-law-body">'+safeRichText(researchResultText(result))+'</div>';
 return items.map(item=>{
  item={...item,title:item.title||item.heading||item.lawTitle||item.law_title||item.name||item.lawName,doc_no:item.doc_no||item.documentNumber,timeliness:item.timeliness||item.validityStatusText,issue_department:item.issue_department||item.promulgatingAgencySummary,issue_date:item.issue_date||item.promulgatingDate,implementation_date:item.implementation_date||item.effectiveDate};
  const title=item.title||'法规材料',body=String(item.article||item.content||item.article_content||item.text||''),status=item.timeliness||'效力状态未提供',url=lawSourceUrl(item);
  const link=url?'<a data-open-law-source target="_blank" rel="noopener noreferrer" href="'+esc(url)+'">查看来源原文 ↗</a>':'<p class="readable-meta">该条检索结果未提供可用的原文链接。</p>';
  return `<article class="readable-card"><h4>${esc(title)}</h4><div><span class="readable-tag ${/废止|失效|已被修改/.test(status)?'law-outdated':''}">${esc(status)}</span>${item.effectiveness?'<span class="readable-tag">'+esc(String(item.effectiveness))+'</span>':''}</div><p class="readable-meta">${esc(item.doc_no||'')}${item.issue_department?' · '+esc(String(item.issue_department)):''}<br>${item.issue_date?'公布：'+esc(item.issue_date):''}${item.implementation_date?' · 施行：'+esc(item.implementation_date):''}</p><div class="readable-law-body">${safeRichText(body.slice(0,240))}${body.length>240?'…':''}</div>${body.length>240?'<details><summary>展开完整条文</summary><div class="readable-law-body">'+safeRichText(body)+'</div></details>':''}${link}<p class="readable-meta">检索命中不代表适用于本合同，请核对条文与合同事实。</p></article>`;
 }).join('');
}

/* Integrate inside the workbench async closure. This path only updates legal
 * metadata on saved review issues; it never starts review, drafting or Word edits. */
let legalOnlyRetryTask=null;
const copyLegalRetryValue=value=>JSON.parse(JSON.stringify(value));

function incompleteLegalRetryPlan(contract){
 const issues=contract.liveReview?.issues||[],records=contract.lastLegalSearch?.issueSearches||{};
 const search=[],associate=[];
 for(const issue of issues){
  const record=records[issue.id];
  if(!record||record.error||['failed','skipped','interrupted','pending'].includes(record.state)){search.push(issue);associate.push(issue);}
  else if(!['linked','no-relevant-evidence'].includes(record.association?.state))associate.push(issue);
 }
 return {search,associate,ids:new Set(associate.map(issue=>issue.id))};
}

function legalRetryRecordSnapshot(record){
 if(!record)return null;
 const {retryAttempts,...snapshot}=copyLegalRetryValue(record);
 return snapshot;
}

function legalRetryWarnings(legal,issues){
 const warnings=[];
 for(const issue of issues){
  const record=legal.issueSearches?.[issue.id];
  if(record?.error)warnings.push('“'+issue.title+'”法规检索未完成：'+record.error);
  else if(record?.association?.error)warnings.push('“'+issue.title+'”法规关联未完成：'+record.association.error);
 }
 return [...new Set(warnings)];
}

function syncRetriedLegalEvidence(contract,review,working,workIssues){
 const oldLegal=contract.lastLegalSearch||{materials:[]};
 const originals=new Map(review.issues.map(issue=>[issue.id,issue]));
 const fingerprint=item=>JSON.stringify(item);
 for(const draft of workIssues){
  const issue=originals.get(draft.id);if(!issue)continue;
  const oldAutomatic=new Set(linkedLegalEvidence(issue,oldLegal.materials||[]).map(fingerprint));
  issue.legalEvidenceIds=[...(draft.legalEvidenceIds||[])];issue.legalReason=draft.legalReason||'';
  const automatic=linkedLegalEvidence(issue,working.materials||[]);
  const update=target=>{
   // Manual queries have their own endpoint metadata and do not match the
   // old automatic evidence fingerprint, so they survive this update.
   const kept=(target.externalEvidence||[]).filter(item=>!oldAutomatic.has(fingerprint(item)));
   const unique=new Map([...kept,...automatic].map(item=>[fingerprint(item),item]));
   if(Array.isArray(target.externalEvidence))target.externalEvidence.splice(0,target.externalEvidence.length,...unique.values());
   else target.externalEvidence=[...unique.values()];
   target.legalReason=issue.legalReason;
  };
  for(const risk of contract.risks||[])if((risk.issueId||risk.id)===issue.id)update(risk);
  for(const record of contract.checks||[])if(record.ruleId===issue.id)update(record);
 }
 contract.lastLegalSearch=working;
 const linked=review.issues.filter(issue=>issue.legalEvidenceIds?.length).length;
 const incomplete=review.issues.filter(issue=>{const record=working.issueSearches?.[issue.id];return !record||record.error||!['complete','empty'].includes(record.state)||!['linked','no-relevant-evidence'].includes(record.association?.state);}).length;
 working.complete=incomplete===0;working.warnings=legalRetryWarnings(working,review.issues);
 const status=(contract.checks||[]).find(record=>record.ruleId==='legal-search-status');
 if(status){status.detail='本次法规记录：'+linked+' 条意见有明确引用；'+incomplete+' 个风险的法规检索或关联待完成。仅更新法规记录，合同审查批次保持原结果。';status.result=incomplete?'unable':linked?'risk':'pass';}
 const warning=(contract.checks||[]).find(record=>record.ruleId==='legal-incomplete');
 if(warning){warning.detail=working.warnings.join('；');warning.result=incomplete?'unable':'pass';warning.name=incomplete?'外部法规记录待完成':'外部法规记录已补全';}
 return incomplete;
}

async function retryIncompleteLegal(contract=current()){

  const old=working.issueSearches[issue.id],snapshot=legalRetryRecordSnapshot(old);
  const retryAttempts=[...(old?.retryAttempts||[]),...(snapshot?[snapshot]:[])];
  if(plan.search.some(item=>item.id===issue.id))working.issueSearches[issue.id]={issueId:issue.id,title:issue.title,state:'pending',materialIds:[],retryAttempts};

  issue.legalEvidenceIds=[];issue.legalReason='本次法规重试尚未完成';

  if(!await saveDurably())saved=false;

  await checkpoint();
  if(plan.search.length){
   legalOnlyRetryTask.stage='正在重试 '+plan.search.length+' 个风险的法规检索';
   reviewProgress({stage:legalOnlyRetryTask.stage,total:plan.search.length,unit:'个风险'});
   let result;
   try{result=await summaryRequest({kind:'legal-issues',serviceId,contractType:contract.type||'合同',text:contract.type||'合同',question:'仅重试未完成风险的法规检索',issues:plan.search.map(({id,title,detail})=>({id,title,detail}))},controller.signal);}
   catch(error){
    result={materials:[],issueSearches:Object.fromEntries(plan.search.map(issue=>[issue.id,{issueId:issue.id,title:issue.title,state:'failed',materialIds:[],error:controller.signal.aborted?'本次法规重试已停止，未取得完整查询结果':error.message}]))};
    if(controller.signal.aborted)stopped=true;
   }
   const pool=new Map(working.materials.map(material=>[material.id,material]));
   const newIds=new Set();
   for(const issue of plan.search){
    const old=working.issueSearches[issue.id],record=result.issueSearches?.[issue.id];
    working.issueSearches[issue.id]=record?{...record,retryAttempts:old.retryAttempts}:{...old,state:'failed',error:'检索服务未返回本风险的结果'};
    for(const id of record?.materialIds||[])newIds.add(id);

  if(legalOnlyRetryTask?.controller===controller)legalOnlyRetryTask=null;

function groupedRiskEntries(contract,adapters={}){
 const manual=(adapters.manualEntries||manualReviewEntries)(contract);
 const orderedManual=[...manual.filter(item=>item.issue?.quote?.trim()),...manual.filter(item=>!item.issue?.quote?.trim())];
 const decide=adapters.decision||decision,related=adapters.related||relatedRiskLocations;
 const entries=[...contract.risks.map((risk,index)=>({key:risk.id,risk,number:index+1,title:risk.title,level:risk.level,done:['accepted','kept'].includes(decide(contract,risk).status)})),
  ...orderedManual.map((entry,index)=>({key:entry.record.ruleId,entry,number:contract.risks.length+index+1,title:entry.issue?.title||entry.record.name,level:entry.issue?.severity,done:!!entry.record.applied,missing:!entry.issue?.quote?.trim()}))];
 const byKey=new Map(entries.map(entry=>[entry.key,entry])),parents=new Map(entries.map(entry=>[entry.key,entry.key]));
 const root=key=>{let current=key;while(parents.get(current)!==current)current=parents.get(current);return current;};
 for(const entry of entries){
  const peers=related(contract,entry.key)||[];
  if(peers.length<2||!peers.some(peer=>peer.key===entry.key))continue;for(const peer of peers)if(byKey.has(peer.key)){const a=root(entry.key),b=root(peer.key);if(a!==b)parents.set(b,a);}
 }
 const buckets=new Map();
 for(const entry of entries){const key=root(entry.key);if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(entry);}
 const occurrence=adapters.occurrences||((entry)=>reviewOccurrenceCount(contract,entry.risk?(riskWritePlan(contract,entry.risk)?.original||entry.risk.quote):(manualDraftOriginal(entry.entry.record,entry.entry.issue)||entry.entry.issue?.quote)));
 return [...buckets.values()].map(members=>({key:contract.id+':'+members.map(member=>member.key).join('|'),members,title:members[0].title,multi:members.length>1||members.some(member=>occurrence(member)>1),done:members.every(member=>member.done)}));
}

function groupedRiskMatches(group,options={}){
 const level=options.level||'all',status=options.status||'all';
 return (!options.multiOnly||group.multi)&&(status==='all'||(status==='done'?group.done:!group.done))&&group.members.some(member=>level==='all'||member.level===level);
}

   if(leafHeading){const number=leafHeading.querySelector('.risk-num'),title=leafHeading.querySelector('.risk-title');if(number)number.textContent='第'+(index+1)+'处';if(title)title.textContent='原意见'+entry.number+' · '+entry.title;leafHeading.setAttribute('aria-expanded','true');}

 };
};
/* onboarding-demo-integration:v1 */
if(window.ContractReviewDemo){
 const demo=window.ContractReviewDemo;
 demo.add(data,sample,true);
 const demoBaseRisk=riskHTML;
 riskHTML=function(c,r){
  if(!c.onboardingDemo)return demoBaseRisk(c,r);
  const d=c.decisions[r.id]||{status:'open'},active=selected===r.id;
  return `<article class="risk-card ${active?'active':''}"><button class="risk-heading" data-action="select-risk" data-id="${esc(r.id)}" aria-expanded="${active}"><span class="risk-num">${c.risks.indexOf(r)+1}</span><span class="risk-title">${esc(r.title)}</span>${badge(r,c)}</button>${active?`<div class="risk-detail"><div class="risk-label">原文 <button class="text-link" data-demo-locate="${r.clause}">定位原文</button></div><div class="quote">${esc(r.quote)}</div><div class="risk-label">为什么要改</div><p class="explanation">${esc(r.why)}</p><div class="suggestion"><div class="risk-label">${d.status==='accepted'?'已采纳的写法':'修改建议'}</div><p>${esc(d.text||r.suggestion)}</p></div><div class="risk-actions">${d.status==='accepted'||d.status==='kept'?`<button class="btn soft" data-action="undo" data-id="${esc(r.id)}">撤回处理</button>`:`<button class="btn primary" data-v2="wps-insert" data-id="${esc(r.id)}">采纳修改（演示）</button><button class="btn" data-action="keep" data-id="${esc(r.id)}">保留原文</button>`}</div><div class="risk-footer">预设演示关注点 · 非法律结论</div></div>`:''}</article>`;
 };
 const demoBaseReview=renderReview;
 renderReview=function(){
  const c=current();
  if(!c?.onboardingDemo)return demoBaseReview();
  old.review();
  const notice=document.createElement('div');notice.className='v2-note';notice.setAttribute('role','note');
  notice.innerHTML='<strong>演示合同 · 虚构材料与预设风险</strong><br>① 点风险查看原文 → ② 采纳修改 → ③ 查看左侧增删 → ④ 撤回或导出演示 Word。此演示不调用模型或在线 Word 服务。';
  document.querySelector('.document-side')?.prepend(notice);
  const meta=document.querySelector('.paper-meta');if(meta)meta.textContent='虚构演示材料 · 不用于实际签约';
  document.querySelectorAll('[data-v2="wps-insert"]').forEach(b=>{b.disabled=false;b.textContent='采纳修改（演示）';});
  const bottom=document.querySelector('.panel-bottom span');if(bottom)bottom.textContent='预设演示风险 · 非模型审查结果';
  document.querySelector('[data-action="versions"]')?.setAttribute('data-demo-history','');
 };
 const demoBaseShell=shell;
 shell=function(){
  demoBaseShell();
  if(view!=='projects')return;
  const intro=document.querySelector('#project-intro');if(!intro)return;
  const button=document.createElement('button');button.className='btn soft';button.dataset.demoOpen='true';
  button.textContent=data.v2.projects.some(p=>p.id===demo.projectId)?'打开演示项目 →':'添加演示项目 →';
  intro.prepend(button,document.createTextNode(' '));
 };
 window.addEventListener('click',event=>{
  const button=event.target.closest('button');if(!button)return;
  if(button.dataset.demoOpen){
   event.preventDefault();event.stopImmediatePropagation();
   const project=demo.add(data,sample);if(!project){toast('无法添加演示项目，已有材料未改变');return;}
   save();openDoc(demo.contractId);return;
  }
  const c=current();if(!c?.onboardingDemo)return;
  if(button.dataset.demoLocate!==undefined){event.preventDefault();event.stopImmediatePropagation();document.querySelectorAll('.clause')[Number(button.dataset.demoLocate)]?.scrollIntoView({block:'center',behavior:'smooth'});return;}
  const a=button.dataset.action,v=button.dataset.v2,id=button.dataset.id;
  if(['run-project','run-selected','run-current'].includes(v)){
   event.preventDefault();event.stopImmediatePropagation();openDoc(c.id);toast('演示使用预设风险，不会发起模型审查');return;
  }
  if(v==='wps-insert'||v==='wps-undo'||['accept','keep','undo'].includes(a)){
   event.preventDefault();event.stopImmediatePropagation();
   demo.decide(c,id,v==='wps-insert'||a==='accept'?'accepted':a==='keep'?'kept':'open',c.decisions[id]?.text);
   save();renderReview();toast('演示修改已保存到本机');return;
  }
  if(a==='export'||button.dataset.demoExport){
   event.preventDefault();event.stopImmediatePropagation();
   if(button.dataset.demoExport){download(old.docx(true),'演示合同（虚构·带修改）.docx');return;}
   modal('导出演示合同','<p class="modal-sub">导出当前演示修改，Word 文件带有“虚构示例”说明。无需配置在线编辑服务。</p>','<button class="btn primary" data-demo-export="true">下载演示 Word</button>'+action('close','关闭'));return;
  }
  if(a==='save-version'){
   event.preventDefault();event.stopImmediatePropagation();
   c.versions.push({id:uid('demo-version'),name:'演示修改 · '+now(),time:now(),clauses:clone(c.clauses),decisions:clone(c.decisions),overrides:clone(c.overrides)});save();toast('演示版本已保存（正文与处理记录）');return;
  }
  if(a==='versions'){
   event.preventDefault();event.stopImmediatePropagation();
   modal('演示版本记录',c.versions.map(v=>'<section class="compare-section"><strong>'+esc(v.name)+'</strong><p>'+esc(v.time)+' · '+Object.values(v.decisions||{}).filter(d=>d.status==='accepted').length+' 项采纳修改</p></section>').join(''),action('close','关闭'));return;
  }
  if(a==='ask-risk'||a==='send-chat'||a==='prompt'){
   event.preventDefault();event.stopImmediatePropagation();
   modal('演示风险说明','<p class="modal-sub">这些风险和建议是预设示例。真实 AI 审查与问答需要配置模型服务，并由你确认后发起。</p>',action('close','知道了'));return;
  }
 },true);
}
/* /onboarding-demo-integration:v1 */

view='projects';await saveDurably();shell();
})();
